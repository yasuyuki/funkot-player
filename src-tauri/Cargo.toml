[package]
name = "funkot-player"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Auto-DJ music player for Funkot, built on funkot-core"

[lib]
name = "funkot_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# tauri's build script sets `dev = !custom-protocol`, and a dev build loads
# `devUrl` (the Vite server) instead of the assets baked in from `frontendDist`.
# `tauri build` / `tauri android build` pass this feature; `tauri dev` does not.
# Without it every build is a dev build, so a plain `cargo build` produces a
# binary that shows "Could not connect to localhost" with no dev server up.
# DO NOT REMOVE.
[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# `devtools` is the inspector API. We only *open* it in debug desktop
# (see `run` setup). Release Store builds must not auto-open it.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
log = "0.4"
# Embedded tags for Android MediaSession title/artist (probe only; no decode).
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "id3v2",
] }
# Feedback ZIP (`share_feedback`): Stored only, no extra codecs.
zip = { version = "8", default-features = false }

# Path dependency on purpose: the two repos are kept separate to stop sources
# mixing, not to make this one build in isolation. ./dev.sh mounts the sibling
# checkout at the matching location. Switch to a git dependency pinned to a tag
# once funkot-autodj publishes the release carrying `Engine::new_with_source`.
#
# The sibling is `funkot-autodj-for-ui`, a second checkout of the funkot-autodj
# repo reserved for this player: a path dependency builds whatever is checked
# out, so sharing one checkout with engine work meant an unrelated branch switch
# changed this build. Engine work stays in `funkot-autodj`; this one only moves
# when the player needs it.
funkot-core = { path = "../../funkot-autodj-for-ui/funkot-core" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
# Only used to hand the Android Context to cpal's AAudio host; see JNI_OnLoad in
# src/lib.rs. Versions must match what cpal 0.18 links against.
jni = "0.22"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
# デスクトップのフォルダ選択ダイアログ（set_music_dir）。Rust からしか呼ばないので
# capabilities への dialog 権限追加は不要。Android は folder picker 非対応なので入れない。
#
# default-features = false は必須。このプラグインの default は ["gtk3"] で、
# rfd 0.16 の backend.rs は not(feature = "gtk3") のときにしか
# xdg_desktop_portal モジュールをコンパイルしない -- 両方立てると GTK3 が黙って勝つ。
# Flatpak / snap ではサンドボックス外を選ばせるためにポータル経路が要る。
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

# The shipped APK is a --debug build (see README), so the dev profile is what
# runs on the phone. Unoptimized, funkot-core's decode/analysis/stretch is ~26x
# slower: a full-track Preserve stretch measured 162s instead of 6.3s, which is
# longer than the 20s head preview `prepare_first_live` plays while it runs, so
# the first track went silent for minutes waiting for the Upgrade.
#
# funkot-autodj sets this in its own workspace root, but profile settings come
# from the workspace being built -- as a path dependency here, funkot-core got
# this crate's (absent) settings instead. Do not delete without making the
# Android build --release.
#
# "*" covers signalsmith-stretch too: cc passes OPT_LEVEL to the C++ compiler,
# so the header-only DSP is what the -O0 penalty mostly lands on.
[profile.dev.package."*"]
opt-level = 2

[package]
name = "funkot-player"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "Auto-DJ music player for Funkot, built on funkot-core"

[lib]
name = "funkot_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# tauri's build script sets `dev = !custom-protocol`, and a dev build loads
# `devUrl` (the Vite server) instead of the assets baked in from `frontendDist`.
# `tauri build` / `tauri android build` pass this feature; `tauri dev` does not.
# Without it every build is a dev build, so a plain `cargo build` produces a
# binary that shows "Could not connect to localhost" with no dev server up.
[features]
custom-protocol = ["tauri/custom-protocol"]
verified-capture = []

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
tempfile = "3"
cpal = "0.18"
log = "0.4"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac", "id3v2",
] }
zip = { version = "9", default-features = false }

funkot-core = { path = "../../funkot-autodj-for-ui/funkot-core" }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
libc = "0.2"
# Only used to hand the Android Context to cpal's AAudio host; see JNI_OnLoad in
# src/lib.rs. Versions must match what cpal 0.18 links against.
jni = "0.22"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
# wayland は親ウィンドウ識別子のため。無いと Wayland の set_parent はポータルに渡らない。
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

# Debug APKs (`tauri android build --debug`) run the dev profile. Unoptimized,
# funkot-core's decode/analysis/stretch is ~26x slower: a full-track Preserve
# stretch measured 162s instead of 6.3s, longer than the 20s head preview
# `prepare_first_live` plays while it runs.
#
# Cargo reads profile settings only from the root manifest of the workspace
# being built, so funkot-autodj's own profile does not reach this path
# dependency.
#
# "*" covers signalsmith-stretch too: cc passes OPT_LEVEL to the C++ compiler,
# so the header-only DSP is what the -O0 penalty mostly lands on.
[profile.dev.package."*"]
opt-level = 2

name: Windows MSIX

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: funkot-player
    shell: pwsh

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - name: Checkout funkot-player
        uses: actions/checkout@v7
        with:
          path: funkot-player

      - id: core
        name: Read adopted core commit
        run: '"sha=$((Get-Content funkot-core.commit -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Checkout funkot-autodj (sibling)
        uses: actions/checkout@v7
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ steps.core.outputs.sha }}
          path: funkot-autodj-for-ui

      - name: Verify the official core selection
        run: bash ./scripts/check-funkot-core-commit.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: funkot-player/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: funkot-player/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build and pack unsigned MSIX
        run: .\packaging\msix\scripts\pack-msix.ps1

      - name: Verify packed MSIX package languages
        shell: bash
        run: ./scripts/check-msix-languages.sh packaging/msix/out/*.msix

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: funkot-player-windows-msix
          path: funkot-player/packaging/msix/out/*.msix
          if-no-files-found: error

name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-pin:
    name: Read adopted core commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.core.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: core
        run: echo "sha=$(tr -d '\r\n' < funkot-core.commit)" >> "$GITHUB_OUTPUT"

  invariants:
    name: Release-only invariants
    runs-on: ubuntu-latest
    steps:
      # No `path:` and no sibling checkout: unlike the Windows workflows this
      # job builds nothing, so it needs neither funkot-core nor a toolchain.
      - uses: actions/checkout@v7

      # Checks that need no toolchain live in one script, so that the same
      # command runs here and on a developer's machine. Keep this job free of
      # builds -- the moment it needs the Android SDK it stops being cheap
      # enough to run on every push, and it will get restricted to tags, which
      # is far too late for a release-only invariant.
      - name: Check release-only invariants
        run: ./scripts/check-release-invariants.sh

      # Eight files spell out the version and nothing links them, so drift is
      # silent until a package ships with a label that disagrees with its
      # contents. Same script a developer runs; also needs no toolchain.
      - name: Check the version is consistent
        run: ./scripts/set-version.sh --check

      # UI locales live in TS JSON-like catalogues, not MRT resources, so the
      # Store only sees languages listed in Package.appxmanifest. Fail if that
      # list drifts from src/lib/locale.ts LOCALES.
      - name: Check MSIX package languages match UI locales
        run: ./scripts/check-msix-languages.sh

      # Plan-phase citations rot silently: a line number that was true when
      # written becomes a lie that later phases copy. Same script a developer
      # runs; also needs no toolchain. Sibling repos are not checked out here,
      # so symbol resolution against them is deferred and counted, never silent.
      - name: Check doc claims
        run: ./scripts/check-doc-claims.sh

      - name: Test core adoption checks
        run: ./scripts/check-funkot-core-commit.test.sh

  build-and-test:
    name: Frontend and native library
    runs-on: ubuntu-latest
    needs: core-pin
    steps:
      - uses: actions/checkout@v7
        with:
          path: funkot-player
      - uses: actions/checkout@v7
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ needs.core-pin.outputs.sha }}
          path: funkot-autodj-for-ui
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ libclang-dev pkg-config libasound2-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: funkot-player/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the official core selection
        working-directory: funkot-player
        run: ./scripts/check-funkot-core-commit.sh
      - name: Test frontend
        working-directory: funkot-player
        run: |
          npm ci
          npm test
          npm run check
          npm run build
      - name: Test release native library
        working-directory: funkot-player
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --lib

  windows-build-and-test:
    name: Windows frontend and native library
    runs-on: windows-latest
    needs: core-pin
    defaults:
      run:
        working-directory: funkot-player
    steps:
      - uses: actions/checkout@v7
        with:
          path: funkot-player
      - uses: actions/checkout@v7
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ needs.core-pin.outputs.sha }}
          path: funkot-autodj-for-ui
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: funkot-player/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM for bindgen
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw "libclang.dll not found at $env:LIBCLANG_PATH"
          }
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify the official core selection
        shell: bash
        run: ./scripts/check-funkot-core-commit.sh
      - name: Test frontend and native library
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release --features custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    needs: core-pin
    steps:
      - uses: actions/checkout@v7
        with:
          path: funkot-player
      - uses: actions/checkout@v7
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ needs.core-pin.outputs.sha }}
          path: funkot-autodj-for-ui
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: funkot-player/src-tauri/Cargo.toml
          command-arguments: advisories licenses sources
          arguments: --locked

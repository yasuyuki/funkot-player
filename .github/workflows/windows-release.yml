name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: funkot-player

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout funkot-player
        uses: actions/checkout@v7
        with:
          path: funkot-player

      - id: core
        name: Read adopted core commit
        shell: pwsh
        run: '"sha=$((Get-Content funkot-core.commit -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Checkout funkot-autodj (sibling)
        uses: actions/checkout@v7
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ steps.core.outputs.sha }}
          path: funkot-autodj-for-ui

      - name: Verify the official core selection
        shell: bash
        run: ./scripts/check-funkot-core-commit.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: funkot-player/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: funkot-player/src-tauri
          cache-on-failure: true

      - name: Install npm dependencies
        run: npm ci

      - name: Test frontend and native library
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS and upload draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: funkot-player
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles nsis

      - name: Build NSIS (artifact only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri -- build --bundles nsis

      - name: Smoke test native current-track endpoint
        run: node --test scripts/current-track-process.test.mjs

      - name: Upload NSIS artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: funkot-player-windows-nsis
          path: funkot-player/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload tested portable executable
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: funkot-player-windows-portable
          path: |
            funkot-player/src-tauri/target/release/funkot-player.exe
            funkot-player/src-tauri/target/release/*.dll
          if-no-files-found: error

name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      engine_ref:
        description: funkot-autodj ref to build against
        required: true
        default: player/v0.1.1
        type: string

permissions:
  contents: write

env:
  ENGINE_REF: ${{ github.event.inputs.engine_ref || vars.FUNKOT_ENGINE_REF || 'player/v0.1.1' }}

defaults:
  run:
    working-directory: funkot-player

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout funkot-player
        uses: actions/checkout@v4
        with:
          path: funkot-player

      - name: Checkout funkot-autodj (sibling)
        uses: actions/checkout@v4
        with:
          repository: yasuyuki/funkot-autodj
          ref: ${{ env.ENGINE_REF }}
          path: funkot-autodj-for-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: funkot-player/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: funkot-player/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build NSIS and upload draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: funkot-player
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles nsis

      - name: Build NSIS (artifact only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri -- build --bundles nsis

      - name: Upload NSIS artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: funkot-player-windows-nsis
          path: funkot-player/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

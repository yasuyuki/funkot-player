<!-- Android's WebView assumes UTF-8 for a file with no charset; WebKitGTK falls
     back to Latin-1 and renders every button glyph (▶ ⏸ ⏭ ⟳) as mojibake. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>funkot-player</title>
<style>
  /* Tauri on Android draws edge-to-edge: without this the first control sits
     under the status bar / cutout and the system eats the touch. */
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0;
         padding: calc(1rem + env(safe-area-inset-top, 3rem)) 1rem
                  calc(1rem + env(safe-area-inset-bottom, 2rem));
         background: #111; color: #eee; }
  button { font-size: 1.2rem; padding: .8rem 1.6rem; width: 100%;
           background: #2b6; color: #000; border: 0; border-radius: .4rem;
           /* No transition: a tap must show up immediately, not after a fade. */
           touch-action: manipulation; -webkit-tap-highlight-color: rgba(255,255,255,.25); }
  button:active { filter: brightness(1.4); transform: scale(.98); }
  button[disabled] { opacity: .45; }
  .row { display: flex; gap: .6rem; margin-top: .6rem; }
  .row button { background: #369; color: #fff; }
  /* #status's colour is one of these classes, never an inline style, for the
     same reason #toggle's state classes below are: keeping colour rules in
     the stylesheet is what makes their precedence explicit and reviewable. */
  #status { margin: 0 0 .6rem; font-size: .95rem; }
  /* Below #status, so it reads as a detail of it rather than a second status
     line. The reserved height is what keeps the transport buttons from
     jumping down a line the moment a title arrives -- an empty div collapses
     to nothing, and ▶ start would move out from under a thumb already on
     its way to it. */
  #now { margin: 0 0 .6rem; min-height: 1.2em; font-size: .85rem; color: #999; }
  #status.idle { color: #777; }
  #status.starting, #status.paused, #status.stalled { color: #fa6; }
  #status.playing { color: #6c9; }
  #status.failed, #status.disconnected { color: #f66; }
  /* `.row button` sets a blue background for every button in the transport
     row, #toggle included. Its playing/paused/off looks are expressed as
     classes with an id-qualified selector (id + class beats element + class
     no matter which rule comes later in the sheet) so the state the webview
     computes always wins over that default, instead of depending on
     declaration order. */
  #toggle.st-playing { background: #2b6; color: #000; }
  #toggle.st-paused { background: #b83; color: #000; }
  #toggle.st-off, #go.st-off, #next.st-off { background: #444; color: #777; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: .8rem;
        background: #000; padding: .6rem; border-radius: .3rem; margin-top: 1rem; }
  .err { color: #f66; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid #333; }
  .low { color: #fa6; }
  /* Action buttons live inside table cells, so they must opt out of the
     full-width rule the standalone transport buttons rely on. */
  button.mini { width: auto; font-size: 1rem; padding: .25rem .6rem;
                background: #444; color: #eee; }
  button.mini[disabled] { opacity: .3; }
  td.act { width: 1%; white-space: nowrap; text-align: right; }
  .reserved { color: #6c9; }
  /* Editable bar counts read as buttons; the derived mix trigger next to them
     is greyed so it is clearly not something to tap. */
  button.bars { min-width: 3.2rem; }
  td.mix { color: #777; width: 1%; }
</style>

<div id="status" class="idle">idle</div>
<div id="now"></div>
<button id="go">▶ start</button>
<div class="row">
  <button id="toggle">⏸ pause / play</button>
  <button id="next">⏭ next</button>
</div>
<div class="row">
  <button id="scan">⟳ scan</button>
</div>
<div id="progress"></div>
<table id="library"></table>
<table id="queue"></table>
<pre id="log">idle</pre>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const nowEl = document.getElementById("now");
  const goBtn = document.getElementById("go");
  const toggleBtn = document.getElementById("toggle");
  const nextBtn = document.getElementById("next");
  const scanBtn = document.getElementById("scan");

  // Every command round-trips through the host, and some of them touch the
  // filesystem; without this a tap looks ignored until the reply lands.
  async function withBusy(button, fn) {
    button.disabled = true;
    try {
      await fn();
    } finally {
      button.disabled = false;
    }
  }

  // The app asks the platform where its own directories are; never hard-code
  // them. On Android the path is predictable but a directory created from
  // outside the app is unreadable by it, so it must be the one to ask.
  const dirs = invoke("app_dirs");
  dirs.then((d) => {
    log.textContent = `music: ${d.music_dir}\ncache: ${d.cache_dir}\n\nidle`;
  }).catch((e) => {
    log.innerHTML = `<span class="err">${e}</span>`;
  });

  // Guards the poll_log interval below against being armed twice: start()
  // takes a moment to answer, and disabling #go while busy is the ordinary
  // defence, but nothing stops the phase poll from re-enabling it before
  // that reply lands.
  let logPollTimer = null;

  goBtn.onclick = () => withBusy(goBtn, async () => {
    log.textContent = "starting…";
    try {
      const d = await dirs;
      const found = await invoke("start", {
        musicDir: d.music_dir,
        cacheDir: d.cache_dir,
      });
      log.textContent = `${found}\n`;
      if (!logPollTimer) {
        logPollTimer = setInterval(async () => {
          const lines = await invoke("poll_log");
          log.textContent = `${found}\n` + lines.join("\n");
        }, 500);
      }
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  toggleBtn.onclick = () => withBusy(toggleBtn, async () => {
    try {
      await invoke("toggle_pause");
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  nextBtn.onclick = () => withBusy(nextBtn, async () => {
    try {
      await invoke("skip_next");
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  // --- Library scan + background analysis (B-3) ---
  // No persisted index here on purpose: the cache JSON is the source of
  // truth, so every scan re-walks the folder and re-reads the cache.
  const progress = document.getElementById("progress");
  const library = document.getElementById("library");

  // --- Hand-correcting the bar counts (B-5) ---
  // Tapping a bar count steps to the next value the engine recognises, wrapping
  // at the end. A cycle rather than a text field because this is a phone and
  // the sets are short: the analyzer's own output is always one of these.
  //
  // The outro cell edits the *structural boundary* -- where the track collapses
  // -- not the mix trigger. The trigger is the engine's business: it derives it
  // as boundary + a 16-bar lead-in so the transition finishes exactly where the
  // outro begins. It is shown next to the boundary (greyed) only so the effect
  // of an edit is visible, and cannot be tapped.
  const INTRO_STEPS = [8, 16, 32, 48, 64, 80, 96];
  const OUTRO_STEPS = [8, 16, 32, 64];

  // Next value up from `n`, wrapping. An analyzed value that is not in the set
  // (nothing guarantees one) steps to the smallest value above it instead of
  // being silently snapped, so no tap is ever a no-op.
  function nextStep(steps, n) {
    return steps.find((s) => s > n) ?? steps[0];
  }

  // Kept so a single edited row can be swapped in without re-scanning.
  let libraryRows = [];

  function renderLibrary(rows) {
    libraryRows = rows;
    const cell = (n, low, manual, attr) => {
      if (n === null || n === undefined) return "<td>-</td>";
      const mark = manual ? "*" : low ? "!" : "";
      return (
        `<td class="${low && !manual ? "low" : ""}">` +
        `<button class="mini bars" ${attr}="${n}">${n}${mark}</button></td>`
      );
    };
    library.innerHTML =
      "<tr><th>track</th><th>intro</th><th>outro</th><th>mix</th><th></th></tr>" +
      rows
        .map(
          (r) =>
            `<tr data-path="${r.path}"><td>${r.name}</td>` +
            cell(r.intro_bars, r.intro_low_confidence, r.intro_manual, "data-intro") +
            cell(r.outro_structure_bars, r.outro_low_confidence, r.outro_manual, "data-outro") +
            `<td class="mix">${r.outro_bars ?? ""}</td>` +
            `<td class="act"><button class="mini" data-add="${r.path}">+</button></td></tr>`
        )
        .join("");
  }

  // Delegated so the handler survives renderLibrary replacing every row.
  // Only the tapped button goes disabled -- withBusy is scoped to it, not to
  // the whole table -- so editing one row's bars does not freeze every other
  // row's "+" button while the round trip is in flight.
  library.onclick = (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    const path = b.closest("tr").dataset.path;
    withBusy(b, async () => {
      try {
        if (b.dataset.add !== undefined) {
          await invoke("enqueue", { path: b.dataset.add });
          await refreshQueue();
          return;
        }
        // One side per call: the untouched one stays whatever the analyzer said.
        const args = { path, introBars: null, outroStructureBars: null };
        if (b.dataset.intro !== undefined) {
          args.introBars = nextStep(INTRO_STEPS, Number(b.dataset.intro));
        } else if (b.dataset.outro !== undefined) {
          args.outroStructureBars = nextStep(OUTRO_STEPS, Number(b.dataset.outro));
        } else {
          return;
        }
        // Redraw from what the command returns rather than re-scanning: a scan
        // would re-walk the folder and could restart the analysis worker.
        const row = await invoke("set_bars", args);
        renderLibrary(libraryRows.map((r) => (r.path === row.path ? row : r)));
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
  };

  scanBtn.onclick = () => withBusy(scanBtn, async () => {
    try {
      const rows = await invoke("refresh_library");
      renderLibrary(rows);
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  // The progress payload now carries the row the analysis just produced, so
  // this only has to splice it into the table in place -- no `invoke` here
  // at all, let alone a full `refresh_library` re-walk of the music folder on
  // every one of potentially hundreds of tracks.
  window.__TAURI__.event.listen("analysis-progress", (event) => {
    const { done, total, name, row } = event.payload;
    progress.textContent = `analyzing ${done}/${total}: ${name}`;
    const idx = libraryRows.findIndex((r) => r.path === row.path);
    if (idx === -1) return;
    renderLibrary(libraryRows.map((r, i) => (i === idx ? row : r)));
  });

  window.__TAURI__.event.listen("analysis-done", async () => {
    progress.textContent = "";
    // One last full rescan to catch anything the per-track splice above
    // could not: files added to the folder mid-run, decode failures, etc.
    try {
      renderLibrary(await invoke("refresh_library"));
    } catch (e) {
      // Ignore, as elsewhere: a stray error here shouldn't disrupt the UI
      // now that the worker itself has already finished.
    }
  });

  // --- Host-owned queue (B-2) ---
  // The reserved track is shown apart from the pending ones because it is no
  // longer ours: the engine has already been handed it for preparation and
  // there is no way to take it back (see src-tauri/src/queue.rs). Editing the
  // pending entries therefore takes effect from the track after that one.
  //
  // An empty queue is not an empty playlist -- the drain policy falls back to
  // walking the music folder -- so the table simply disappears when there is
  // nothing queued rather than claiming playback is about to stop.
  const queue = document.getElementById("queue");

  function renderQueue(q) {
    const name = (p) => p.split("/").pop();
    const last = q.pending.length - 1;
    const reserved = q.reserved
      ? `<tr><td class="reserved">▶ ${name(q.reserved)}</td>` +
        `<td class="act">reserved</td></tr>`
      : "";
    const pending = q.pending
      .map(
        (p, i) =>
          `<tr><td>${name(p)}</td><td class="act">` +
          `<button class="mini" data-up="${i}"${i === 0 ? " disabled" : ""}>↑</button> ` +
          `<button class="mini" data-down="${i}"${i === last ? " disabled" : ""}>↓</button> ` +
          `<button class="mini" data-del="${i}">✕</button></td></tr>`
      )
      .join("");
    queue.innerHTML =
      reserved || pending
        ? `<tr><th>queue</th><th></th></tr>${reserved}${pending}`
        : "";
  }

  async function refreshQueue() {
    try {
      renderQueue(await invoke("queue_state"));
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  }

  // Only the tapped button (↑ / ↓ / ✕) goes disabled, same reasoning as the
  // library table above.
  queue.onclick = (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    withBusy(b, async () => {
      try {
        if (d.up !== undefined) {
          await invoke("reorder", { from: Number(d.up), to: Number(d.up) - 1 });
        } else if (d.down !== undefined) {
          await invoke("reorder", { from: Number(d.down), to: Number(d.down) + 1 });
        } else if (d.del !== undefined) {
          await invoke("dequeue", { index: Number(d.del) });
        }
        await refreshQueue();
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
  };

  // --- Transport state (D) ---
  // What the audio thread is actually doing, as opposed to which buttons the
  // webview has tapped -- so a stalled engine, or a pause driven by the
  // notification, shows up here too. See PHASE / player_state in lib.rs.
  const PHASE_LABEL = {
    idle: "idle",
    starting: "starting — preparing the first track",
    playing: "playing",
    paused: "paused",
    stalled: "waiting for the next track to be prepared",
    failed: "failed — see the log below; restart the app to try again",
    disconnected: "output device lost — reconnecting…",
  };

  function applyPhase(phase) {
    status.textContent = PHASE_LABEL[phase] ?? phase;
    status.className = phase;

    // "idle" only, not "failed" as well: the audio thread can only fail after
    // start() has already flipped its `started` latch, so offering the button
    // again would just answer "already started" in red. A failed start needs
    // the app restarted, and saying so in the status line beats a button that
    // looks like it would retry.
    const goEnabled = phase === "idle";
    goBtn.disabled = !goEnabled;
    goBtn.classList.toggle("st-off", !goEnabled);

    toggleBtn.classList.remove("st-playing", "st-paused", "st-off");
    if (phase === "playing" || phase === "stalled") {
      toggleBtn.disabled = false;
      toggleBtn.textContent = "⏸ pause";
      toggleBtn.classList.add("st-playing");
    } else if (phase === "paused") {
      toggleBtn.disabled = false;
      toggleBtn.textContent = "▶ play";
      toggleBtn.classList.add("st-paused");
    } else {
      // idle, starting, failed, disconnected
      toggleBtn.disabled = true;
      toggleBtn.classList.add("st-off");
    }

    const nextEnabled = phase === "playing" || phase === "paused" || phase === "stalled";
    nextBtn.disabled = !nextEnabled;
    nextBtn.classList.toggle("st-off", !nextEnabled);
  }

  async function refreshPlayerState() {
    try {
      const state = await invoke("player_state");
      applyPhase(state.phase);
      // `previous` and `last_transition` also come back here, but v1 shows
      // nothing about transitions while a track is playing -- they exist for
      // the ⚑ flag work (S5), not for display yet.
      nowEl.textContent = state.now_playing ?? "";
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  }

  // One timer for both: the reserved slot and the phase both change on the
  // audio thread's own schedule, with nothing else reporting it back, so both
  // have to be polled -- and there is no reason to run two separate timers
  // for it. start() also reloads queue.json, so the persisted queue shows up
  // here without the UI having to know when that happened.
  async function pollState() {
    await Promise.all([refreshQueue(), refreshPlayerState()]);
  }
  pollState();
  setInterval(pollState, 500);
</script>

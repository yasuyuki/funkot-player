<!-- Android's WebView assumes UTF-8 for a file with no charset; WebKitGTK falls
     back to Latin-1 and renders every button glyph (▶ ⏸ ⏭ ⟳) as mojibake. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>funkot-player</title>
<style>
  /* Tauri on Android draws edge-to-edge: without this the first control sits
     under the status bar / cutout and the system eats the touch. */
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0;
         padding: calc(1rem + env(safe-area-inset-top, 3rem)) 1rem
                  calc(1rem + env(safe-area-inset-bottom, 2rem));
         background: #111; color: #eee; }
  button { font-size: 1.2rem; padding: .8rem 1.6rem; width: 100%;
           background: #2b6; color: #000; border: 0; border-radius: .4rem;
           /* No transition: a tap must show up immediately, not after a fade. */
           touch-action: manipulation; -webkit-tap-highlight-color: rgba(255,255,255,.25); }
  button:active { filter: brightness(1.4); transform: scale(.98); }
  button[disabled] { opacity: .45; }
  .row { display: flex; gap: .6rem; margin-top: .6rem; }
  .row button { background: #369; color: #fff; }
  /* #status's colour is one of these classes, never an inline style, for the
     same reason #toggle's state classes below are: keeping colour rules in
     the stylesheet is what makes their precedence explicit and reviewable. */
  #status { margin: 0 0 .6rem; font-size: .95rem; }
  /* Below #status, so it reads as a detail of it rather than a second status
     line. The reserved height is what keeps the transport buttons from
     jumping down a line the moment a title arrives -- an empty div collapses
     to nothing, and ▶ start would move out from under a thumb already on
     its way to it. */
  #now { margin: 0 0 .6rem; min-height: 1.2em; font-size: .85rem; color: #999; }
  #status.idle { color: #777; }
  #status.starting, #status.paused, #status.stalled { color: #fa6; }
  #status.playing { color: #6c9; }
  #status.failed, #status.disconnected { color: #f66; }
  /* `.row button` sets a blue background for every button in the transport
     row, #toggle included. Its playing/paused/off looks are expressed as
     classes with an id-qualified selector (id + class beats element + class
     no matter which rule comes later in the sheet) so the state the webview
     computes always wins over that default, instead of depending on
     declaration order. */
  #toggle.st-playing { background: #2b6; color: #000; }
  #toggle.st-paused { background: #b83; color: #000; }
  #toggle.st-off, #go.st-off, #next.st-off, #flag.st-off { background: #444; color: #777; }
  #flag-toast { margin: .4rem 0 0; font-size: .85rem; color: #ccc; min-height: 1.2em; }
  #flag-toast[hidden] { display: none; }
  #flag-toast button.undo-flag { width: auto; font-size: inherit; padding: 0;
                                 background: transparent; color: #6af;
                                 text-decoration: underline; border-radius: 0; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: .8rem;
        background: #000; padding: .6rem; border-radius: .3rem; margin-top: 1rem; }
  .err { color: #f66; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
  td, th { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid #333; }
  .low { color: #fa6; }
  /* Action buttons live inside table cells, so they must opt out of the
     full-width rule the standalone transport buttons rely on. */
  button.mini { width: auto; font-size: 1rem; padding: .25rem .6rem;
                background: #444; color: #eee; }
  button.mini[disabled] { opacity: .3; }
  td.act { width: 1%; white-space: nowrap; text-align: right; }
  .reserved { color: #6c9; }
  /* Editable bar counts read as buttons; the derived mix trigger next to them
     is greyed so it is clearly not something to tap. */
  button.bars { min-width: 3.2rem; }
  td.mix { color: #777; width: 1%; }
  /* Play / edit mode tabs + overflow (scan). UI-only; does not touch transport. */
  .tabs-bar { display: flex; align-items: center; gap: .4rem; margin-top: .8rem; }
  .tabs { display: flex; gap: .3rem; flex: 1; }
  button.tab { width: auto; flex: 1; font-size: 1rem; padding: .45rem .8rem;
               background: #333; color: #aaa; }
  button.tab.active { background: #369; color: #fff; }
  .overflow { position: relative; flex: 0 0 auto; }
  button.menu-btn { width: auto; font-size: 1.2rem; padding: .35rem .7rem;
                    background: #333; color: #eee; }
  .menu { position: absolute; right: 0; top: 100%; margin-top: .25rem;
          background: #222; border: 1px solid #444; border-radius: .3rem;
          padding: .25rem; z-index: 10; min-width: 7rem; }
  .menu[hidden] { display: none; }
  .menu button { width: 100%; font-size: .95rem; padding: .5rem .7rem;
                 background: transparent; color: #eee; text-align: left;
                 border-radius: .2rem; }
  .menu button:active { background: #369; }
  .panel[hidden] { display: none; }
  td.dur { width: 1%; white-space: nowrap; color: #999; }
  /* Edit-tab secondary: 直すべきつなぎ / すべての曲 */
  .subtabs { display: flex; gap: .3rem; margin-top: .6rem; }
  #flagged-list, #flagged-detail { margin-top: .6rem; }
  #flagged-detail[hidden], #flagged-list[hidden] { display: none; }
  .flagged-empty { color: #999; margin: .8rem 0 .4rem; }
  button.linkish { width: auto; font-size: inherit; padding: 0;
                   background: transparent; color: #6af;
                   text-decoration: underline; border-radius: 0; }
  .flagged-row { border-bottom: 1px solid #333; display: flex;
                 align-items: baseline; gap: .4rem; }
  .flagged-head { flex: 1; text-align: left; background: transparent;
                  color: #eee; font-size: .95rem; padding: .5rem .2rem;
                  display: flex; flex-wrap: wrap; gap: .35rem .6rem;
                  align-items: baseline; border-radius: 0; }
  .flagged-head[disabled] { opacity: .55; }
  .flagged-artist { color: #999; font-size: .85rem; }
  .flagged-role { color: #aaa; font-size: .85rem; }
  .flagged-count { margin-left: auto; }
  .flagged-warn { color: #fa6; }
  .flagged-unanalyzed { color: #999; font-size: .85rem; }
  .flagged-detail-meta { font-size: .9rem; color: #ccc; margin: .4rem 0 .8rem; }
  .flagged-detail-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
  .flagged-detail-actions button { width: auto; font-size: .95rem;
                                   padding: .45rem .9rem; background: #444; color: #eee; }
  .chip-editor { margin: .4rem 0 .8rem; }
  .chip-editor h3 { margin: 0 0 .25rem; font-size: .95rem; font-weight: 600; }
  .chip-scale { font-size: .8rem; color: #888; margin: 0 0 .35rem; }
  .chip-row { display: flex; flex-wrap: wrap; gap: .35rem; }
  button.chip { width: auto; font-size: 1rem; padding: .25rem .6rem;
                background: #444; color: #eee; }
  button.chip.current { background: #369; color: #fff; }
  .chip-hint { font-size: .8rem; color: #999; margin: .35rem 0 0; }
  tr.chip-editor-row td { padding: .2rem .4rem .55rem; border-bottom: 1px solid #333; }
</style>

<div id="status" class="idle">idle</div>
<div id="now"></div>
<button id="go">▶ start</button>
<div class="row">
  <button id="toggle">⏸ pause / play</button>
  <button id="next">⏭ next</button>
  <button id="flag" class="st-off" disabled>⚑</button>
</div>
<div id="flag-toast" hidden></div>
<div class="tabs-bar">
  <div class="tabs">
    <button type="button" id="tab-play" class="tab active">再生</button>
    <button type="button" id="tab-edit" class="tab">編集</button>
  </div>
  <div class="overflow">
    <button type="button" id="menu-btn" class="menu-btn" aria-label="menu">⋮</button>
    <div id="menu" class="menu" hidden>
      <button type="button" id="scan">scan</button>
    </div>
  </div>
</div>
<div id="progress"></div>
<div id="panel-play" class="panel">
  <table id="playlist"></table>
</div>
<div id="panel-edit" class="panel" hidden>
  <div class="subtabs tabs">
    <button type="button" id="subtab-flags" class="tab active">直すべきつなぎ</button>
    <button type="button" id="subtab-all" class="tab">すべての曲</button>
  </div>
  <div id="flagged-list"></div>
  <div id="flagged-detail" hidden></div>
  <table id="library" hidden></table>
</div>
<table id="queue"></table>
<pre id="log">idle</pre>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const nowEl = document.getElementById("now");
  const goBtn = document.getElementById("go");
  const toggleBtn = document.getElementById("toggle");
  const nextBtn = document.getElementById("next");
  const flagBtn = document.getElementById("flag");
  const flagToast = document.getElementById("flag-toast");
  const scanBtn = document.getElementById("scan");
  let flagToastTimer = null;

  function hideFlagToast() {
    if (flagToastTimer) {
      clearTimeout(flagToastTimer);
      flagToastTimer = null;
    }
    flagToast.hidden = true;
    flagToast.replaceChildren();
  }

  // One shared toast slot: a new show replaces the previous (bar / dismiss / flag).
  function showUndoToast(message, onUndo) {
    hideFlagToast();
    flagToast.hidden = false;
    flagToast.appendChild(document.createTextNode(`${message} ｜ `));
    const undo = document.createElement("button");
    undo.type = "button";
    undo.className = "undo-flag";
    undo.textContent = "取消";
    undo.onclick = () => withBusy(undo, async () => {
      try {
        await onUndo();
        hideFlagToast();
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
    flagToast.appendChild(undo);
    flagToastTimer = setTimeout(hideFlagToast, 8000);
  }

  function showFlagToast(fromTitle, toTitle) {
    showUndoToast(`${fromTitle} → ${toTitle} を記録`, async () => {
      await invoke("undo_last_flag");
    });
  }

  // Every command round-trips through the host, and some of them touch the
  // filesystem; without this a tap looks ignored until the reply lands.
  async function withBusy(button, fn) {
    button.disabled = true;
    try {
      await fn();
    } finally {
      button.disabled = false;
    }
  }

  // The app asks the platform where its own directories are; never hard-code
  // them. On Android the path is predictable but a directory created from
  // outside the app is unreadable by it, so it must be the one to ask.
  const dirs = invoke("app_dirs");
  dirs.then((d) => {
    log.textContent = `music: ${d.music_dir}\ncache: ${d.cache_dir}\n\nidle`;
  }).catch((e) => {
    log.innerHTML = `<span class="err">${e}</span>`;
  });

  // Guards the poll_log interval below against being armed twice: start()
  // takes a moment to answer, and disabling #go while busy is the ordinary
  // defence, but nothing stops the phase poll from re-enabling it before
  // that reply lands.
  let logPollTimer = null;

  goBtn.onclick = () => withBusy(goBtn, async () => {
    log.textContent = "starting…";
    try {
      const d = await dirs;
      const found = await invoke("start", {
        musicDir: d.music_dir,
        cacheDir: d.cache_dir,
      });
      log.textContent = `${found}\n`;
      if (!logPollTimer) {
        logPollTimer = setInterval(async () => {
          const lines = await invoke("poll_log");
          log.textContent = `${found}\n` + lines.join("\n");
        }, 500);
      }
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  toggleBtn.onclick = () => withBusy(toggleBtn, async () => {
    try {
      await invoke("toggle_pause");
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  nextBtn.onclick = () => withBusy(nextBtn, async () => {
    try {
      await invoke("skip_next");
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  // Record the last automatic transition only — never touches playback.
  flagBtn.onclick = () => withBusy(flagBtn, async () => {
    try {
      const r = await invoke("flag_last_transition");
      showFlagToast(r.from_title, r.to_title);
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  // --- Library scan + background analysis (B-3) ---
  // No persisted index here on purpose: the cache JSON is the source of
  // truth, so every scan re-walks the folder and re-reads the cache.
  const progress = document.getElementById("progress");
  const library = document.getElementById("library");
  const playlist = document.getElementById("playlist");
  const panelPlay = document.getElementById("panel-play");
  const panelEdit = document.getElementById("panel-edit");
  const tabPlay = document.getElementById("tab-play");
  const tabEdit = document.getElementById("tab-edit");
  const menuBtn = document.getElementById("menu-btn");
  const menu = document.getElementById("menu");

  // --- Play / edit tabs (S4) ---
  // Pure UI: switching panels must not invoke start/pause/skip or stop audio.
  const flaggedList = document.getElementById("flagged-list");
  const flaggedDetail = document.getElementById("flagged-detail");
  const subtabFlags = document.getElementById("subtab-flags");
  const subtabAll = document.getElementById("subtab-all");
  let flaggedRows = [];
  let openChipKey = null; // "path\\tintro|outro" — at most one library chip editor

  function showFlaggedList() {
    flaggedDetail.hidden = true;
    flaggedDetail.replaceChildren();
    flaggedList.hidden = false;
  }

  function showEditSub(which) {
    const flags = which === "flags";
    library.hidden = flags;
    subtabFlags.classList.toggle("active", flags);
    subtabAll.classList.toggle("active", !flags);
    if (flags) {
      showFlaggedList();
      loadFlaggedTracks();
    } else {
      flaggedList.hidden = true;
      flaggedDetail.hidden = true;
      // Detail-side set_bars updates libraryRows while #library is hidden;
      // redraw so the all-tracks table matches memory (and disk).
      if (libraryRows.length) renderLibrary(libraryRows);
    }
  }

  let flaggedLoadGen = 0;
  async function loadFlaggedTracks() {
    const gen = ++flaggedLoadGen;
    try {
      const rows = await invoke("list_flagged_tracks");
      if (gen !== flaggedLoadGen) return;
      flaggedRows = rows;
      showFlaggedList();
      renderFlaggedTracks(rows);
    } catch (e) {
      if (gen !== flaggedLoadGen) return;
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  }

  async function dismissAndReload(trackHash, role) {
    const n = await invoke("dismiss_flags", { trackHash, role });
    await loadFlaggedTracks();
    if (!n) return;
    showUndoToast("削除しました", async () => {
      await invoke("undo_last_dismiss");
      await loadFlaggedTracks();
    });
  }

  function renderFlaggedTracks(rows) {
    if (!rows.length) {
      flaggedList.innerHTML =
        `<p class="flagged-empty">直すべきつなぎはありません</p>` +
        `<button type="button" class="linkish" id="see-all-tracks">すべての曲を見る</button>`;
      document.getElementById("see-all-tracks").onclick = () => showEditSub("all");
      return;
    }
    flaggedList.innerHTML = "";
    rows.forEach((r, idx) => {
      const roleLabel = r.role === "outgoing" ? "出る側" : "入る側";
      const artist = r.artist
        ? `<span class="flagged-artist">${esc(r.artist)}</span>`
        : "";
      const warn = r.low_confidence
        ? `<span class="flagged-warn">⚠</span>`
        : "";
      const row = document.createElement("div");
      row.className = "flagged-row";
      row.dataset.idx = String(idx);

      if (r.missing) {
        row.innerHTML =
          `<button type="button" class="flagged-head" disabled>` +
          `<span class="flagged-title">${esc(r.title)}</span>${artist}` +
          `<span class="flagged-role">${roleLabel}</span>` +
          `<span class="flagged-count">${r.count}</span>` +
          `</button>` +
          `<button type="button" class="mini flagged-ok">〔問題なかった〕</button>`;
        row.querySelector(".flagged-ok").onclick = (ev) => {
          ev.stopPropagation();
          const b = ev.currentTarget;
          withBusy(b, () => dismissAndReload(r.track_hash, r.role));
        };
      } else if (!r.analyzed) {
        row.innerHTML =
          `<button type="button" class="flagged-head" disabled>` +
          `<span class="flagged-title">${esc(r.title)}</span>${artist}` +
          `<span class="flagged-role">${roleLabel}</span>` +
          `<span class="flagged-count">${r.count}</span>${warn}` +
          `<span class="flagged-unanalyzed">未解析</span>` +
          `</button>`;
      } else {
        row.innerHTML =
          `<button type="button" class="flagged-head">` +
          `<span class="flagged-title">${esc(r.title)}</span>${artist}` +
          `<span class="flagged-role">${roleLabel}</span>` +
          `<span class="flagged-count">${r.count}</span>${warn}` +
          `</button>`;
        row.querySelector(".flagged-head").onclick = () => showFlaggedDetail(r);
      }
      flaggedList.appendChild(row);
    });
  }

  function showFlaggedDetail(row) {
    flaggedList.hidden = true;
    flaggedDetail.hidden = false;
    flaggedDetail.replaceChildren();

    const back = document.createElement("button");
    back.type = "button";
    back.className = "linkish";
    back.textContent = "← 一覧へ";
    back.onclick = () => {
      showFlaggedList();
      renderFlaggedTracks(flaggedRows);
    };
    flaggedDetail.appendChild(back);

    const roleLabel = row.role === "outgoing" ? "出る側" : "入る側";
    const meta = document.createElement("div");
    meta.className = "flagged-detail-meta";
    const partnersText = row.partners
      .map((p) => {
        const left = row.role === "outgoing" ? row.title : p.title;
        const right = row.role === "outgoing" ? p.title : row.title;
        const mul = p.count > 1 ? `×${p.count}` : "";
        return `${left} → ${right}${mul}`;
      })
      .join(" / ");
    meta.innerHTML =
      `<div><strong>${esc(row.title)}</strong>` +
      (row.artist ? ` <span class="flagged-artist">${esc(row.artist)}</span>` : "") +
      `</div>` +
      `<div>${roleLabel} · ${row.count}回` +
      (row.low_confidence ? ` <span class="flagged-warn">⚠</span>` : "") +
      `</div>` +
      `<div>${esc(partnersText)}</div>`;
    flaggedDetail.appendChild(meta);

    const kind = row.role === "outgoing" ? "outro" : "intro";
    const steps = kind === "outro" ? OUTRO_STEPS : INTRO_STEPS;
    const chipHost = document.createElement("div");
    flaggedDetail.appendChild(chipHost);

    function mountChip() {
      const current =
        kind === "outro" ? row.outro_structure_bars : row.intro_bars;
      const manual = kind === "outro" ? row.outro_manual : row.intro_manual;
      chipHost.replaceChildren(
        renderChipEditor({
          steps,
          current,
          kind,
          manual,
          onPick: async (value) => {
            if (!row.path) {
              throw "no path for this track";
            }
            const prevIntro = row.intro_bars;
            const prevOutro = row.outro_structure_bars;
            const args = {
              path: row.path,
              introBars: null,
              outroStructureBars: null,
            };
            if (kind === "intro") args.introBars = value;
            else args.outroStructureBars = value;
            const updated = await invoke("set_bars", args);
            applyFlaggedBarUpdate(row, updated);
            mountChip();
            syncLibraryRow(updated);
            showUndoToast("変更しました", async () => {
              const undoArgs = {
                path: row.path,
                introBars: null,
                outroStructureBars: null,
              };
              if (kind === "intro") undoArgs.introBars = prevIntro;
              else undoArgs.outroStructureBars = prevOutro;
              const restored = await invoke("set_bars", undoArgs);
              applyFlaggedBarUpdate(row, restored);
              mountChip();
              syncLibraryRow(restored);
            });
          },
        })
      );
    }
    mountChip();

    const actions = document.createElement("div");
    actions.className = "flagged-detail-actions";
    for (const [label, cls] of [
      ["〔直った〕", "flagged-fixed"],
      ["〔問題なかった〕", "flagged-ok"],
    ]) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = cls;
      b.textContent = label;
      b.onclick = () => withBusy(b, () => dismissAndReload(row.track_hash, row.role));
      actions.appendChild(b);
    }
    flaggedDetail.appendChild(actions);
  }

  function applyFlaggedBarUpdate(row, updated) {
    Object.assign(row, {
      intro_bars: updated.intro_bars,
      outro_structure_bars: updated.outro_structure_bars,
      outro_bars: updated.outro_bars,
      intro_manual: updated.intro_manual,
      outro_manual: updated.outro_manual,
      analyzed: updated.analyzed,
    });
    const i = flaggedRows.findIndex(
      (r) => r.track_hash === row.track_hash && r.role === row.role
    );
    if (i >= 0) flaggedRows[i] = row;
  }

  function syncLibraryRow(updated) {
    if (!libraryRows.length) return;
    libraryRows = libraryRows.map((r) => (r.path === updated.path ? updated : r));
    if (!library.hidden) renderLibrary(libraryRows);
  }

  subtabFlags.onclick = () => showEditSub("flags");
  subtabAll.onclick = () => showEditSub("all");

  function showTab(which) {
    const play = which === "play";
    panelPlay.hidden = !play;
    panelEdit.hidden = play;
    tabPlay.classList.toggle("active", play);
    tabEdit.classList.toggle("active", !play);
    // Refresh the flags list only when that subtab is showing — do not unhide
    // it over すべての曲.
    if (!play && subtabFlags.classList.contains("active")) {
      loadFlaggedTracks();
    }
  }
  tabPlay.onclick = () => showTab("play");
  tabEdit.onclick = () => showTab("edit");

  menuBtn.onclick = (ev) => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
  };
  document.addEventListener("click", () => { menu.hidden = true; });
  menu.onclick = (ev) => ev.stopPropagation();

  // --- Hand-correcting the bar counts (B-5 / S8) ---
  // Chip picker instead of cycling: every candidate is visible, including a
  // current value that is not in the default step set. The outro cell edits
  // the *structural boundary*; mix is derived and read-only.
  const INTRO_STEPS = [8, 16, 32, 48, 64, 80, 96];
  const OUTRO_STEPS = [8, 16, 32, 64];

  function chipValues(steps, current) {
    const set = new Set(steps);
    if (current !== null && current !== undefined) set.add(Number(current));
    return Array.from(set).sort((a, b) => a - b);
  }

  function renderChipEditor({ steps, current, kind, onPick, manual }) {
    const root = document.createElement("div");
    root.className = "chip-editor";
    const title = document.createElement("h3");
    title.textContent = kind === "intro" ? "イントロ" : "アウトロ";
    root.appendChild(title);
    const scale = document.createElement("div");
    scale.className = "chip-scale";
    scale.textContent = "短い ←──────→ 長い";
    root.appendChild(scale);
    const row = document.createElement("div");
    row.className = "chip-row";
    const cur = current === null || current === undefined ? null : Number(current);
    for (const v of chipValues(steps, cur)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "mini chip" + (cur === v ? " current" : "");
      b.textContent = String(v) + (cur === v && manual ? "*" : "");
      b.onclick = () => {
        if (cur === v) return;
        withBusy(b, () => onPick(v));
      };
      row.appendChild(b);
    }
    root.appendChild(row);
    const hint = document.createElement("p");
    hint.className = "chip-hint";
    hint.textContent =
      kind === "outro"
        ? "長くすると切り替わりが早くなる"
        : "長くするほどイントロを飛ばし、短い前振りで入る";
    root.appendChild(hint);
    return root;
  }

  function formatDuration(secs) {
    if (secs === null || secs === undefined) return "-";
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  // Tag strings (and file names) go into innerHTML cells; escape so a TITLE
  // containing `<` cannot become markup. Paths in data-* stay unescaped —
  // same as before — and are only read back via dataset, not as HTML.
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Kept so a single edited row can be swapped in without re-scanning.
  let libraryRows = [];

  function renderLibrary(rows) {
    libraryRows = rows;
    openChipKey = null;
    const cell = (n, low, manual, attr) => {
      if (n === null || n === undefined) return "<td>-</td>";
      const mark = manual ? "*" : low ? "!" : "";
      return (
        `<td class="${low && !manual ? "low" : ""}">` +
        `<button class="mini bars" ${attr}="${n}">${n}${mark}</button></td>`
      );
    };
    // Edit tab: existing bar table (track / intro / outro / mix / +).
    library.innerHTML =
      "<tr><th>track</th><th>intro</th><th>outro</th><th>mix</th><th></th></tr>" +
      rows
        .map(
          (r) =>
            `<tr data-path="${esc(r.path)}"><td>${esc(r.name)}</td>` +
            cell(r.intro_bars, r.intro_low_confidence, r.intro_manual, "data-intro") +
            cell(r.outro_structure_bars, r.outro_low_confidence, r.outro_manual, "data-outro") +
            `<td class="mix">${r.outro_bars ?? ""}</td>` +
            `<td class="act"><button class="mini" data-add="${esc(r.path)}">+</button></td></tr>`
        )
        .join("");
    // Play tab: title / artist / duration / + (no intro/outro/mix).
    playlist.innerHTML =
      "<tr><th>曲名</th><th>アーティスト</th><th>曲長</th><th></th></tr>" +
      rows
        .map(
          (r) =>
            `<tr data-path="${esc(r.path)}"><td>${esc(r.title)}</td>` +
            `<td>${esc(r.artist)}</td>` +
            `<td class="dur">${formatDuration(r.duration_secs)}</td>` +
            `<td class="act"><button class="mini" data-add="${esc(r.path)}">+</button></td></tr>`
        )
        .join("");
  }

  function closeLibraryChipEditor() {
    library.querySelectorAll("tr.chip-editor-row").forEach((tr) => tr.remove());
    openChipKey = null;
  }

  function openLibraryChipEditor(trackTr, kind) {
    const path = trackTr.dataset.path;
    const key = `${path}\t${kind}`;
    if (openChipKey === key) {
      closeLibraryChipEditor();
      return;
    }
    closeLibraryChipEditor();
    const row = libraryRows.find((r) => r.path === path);
    if (!row || !row.analyzed) return;
    const steps = kind === "intro" ? INTRO_STEPS : OUTRO_STEPS;
    const current = kind === "intro" ? row.intro_bars : row.outro_structure_bars;
    const editorTr = document.createElement("tr");
    editorTr.className = "chip-editor-row";
    const td = document.createElement("td");
    td.colSpan = 5;
    const applyBarPick = async (value) => {
      const prevIntro = row.intro_bars;
      const prevOutro = row.outro_structure_bars;
      const args = { path, introBars: null, outroStructureBars: null };
      if (kind === "intro") args.introBars = value;
      else args.outroStructureBars = value;
      const updated = await invoke("set_bars", args);
      libraryRows = libraryRows.map((r) => (r.path === updated.path ? updated : r));
      renderLibrary(libraryRows);
      // Re-open the same editor on the refreshed row.
      const fresh = Array.from(library.querySelectorAll("tr[data-path]")).find(
        (tr) => tr.dataset.path === path
      );
      if (fresh) {
        openChipKey = null;
        openLibraryChipEditor(fresh, kind);
      }
      showUndoToast("変更しました", async () => {
        const undoArgs = { path, introBars: null, outroStructureBars: null };
        if (kind === "intro") undoArgs.introBars = prevIntro;
        else undoArgs.outroStructureBars = prevOutro;
        const restored = await invoke("set_bars", undoArgs);
        libraryRows = libraryRows.map((r) => (r.path === restored.path ? restored : r));
        renderLibrary(libraryRows);
      });
    };
    const manual = kind === "intro" ? row.intro_manual : row.outro_manual;
    td.appendChild(
      renderChipEditor({ steps, current, kind, manual, onPick: applyBarPick })
    );
    editorTr.appendChild(td);
    trackTr.after(editorTr);
    openChipKey = key;
  }

  // Delegated so the handler survives renderLibrary replacing every row.
  // Bar cells toggle a chip editor under the row; "+" still enqueues.
  library.onclick = (ev) => {
    const b = ev.target.closest("button");
    if (!b || !library.contains(b)) return;
    if (b.classList.contains("chip")) return; // handled by chip onclick
    const trackTr = b.closest("tr[data-path]");
    if (!trackTr) return;
    withBusy(b, async () => {
      try {
        if (b.dataset.add !== undefined) {
          await invoke("enqueue", { path: b.dataset.add });
          await refreshQueue();
          return;
        }
        if (b.dataset.intro !== undefined) {
          openLibraryChipEditor(trackTr, "intro");
          return;
        }
        if (b.dataset.outro !== undefined) {
          openLibraryChipEditor(trackTr, "outro");
          return;
        }
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
  };

  playlist.onclick = (ev) => {
    const b = ev.target.closest("button");
    if (!b || b.dataset.add === undefined) return;
    withBusy(b, async () => {
      try {
        await invoke("enqueue", { path: b.dataset.add });
        await refreshQueue();
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
  };

  scanBtn.onclick = () => withBusy(scanBtn, async () => {
    menu.hidden = true;
    try {
      const rows = await invoke("refresh_library");
      renderLibrary(rows);
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  });

  // The progress payload now carries the row the analysis just produced, so
  // this only has to splice it into the table in place -- no `invoke` here
  // at all, let alone a full `refresh_library` re-walk of the music folder on
  // every one of potentially hundreds of tracks.
  window.__TAURI__.event.listen("analysis-progress", (event) => {
    const { done, total, name, row } = event.payload;
    progress.textContent = `analyzing ${done}/${total}: ${name}`;
    const idx = libraryRows.findIndex((r) => r.path === row.path);
    if (idx === -1) return;
    renderLibrary(libraryRows.map((r, i) => (i === idx ? row : r)));
  });

  window.__TAURI__.event.listen("analysis-done", async () => {
    progress.textContent = "";
    // One last full rescan to catch anything the per-track splice above
    // could not: files added to the folder mid-run, decode failures, etc.
    try {
      renderLibrary(await invoke("refresh_library"));
    } catch (e) {
      // Ignore, as elsewhere: a stray error here shouldn't disrupt the UI
      // now that the worker itself has already finished.
    }
  });

  // --- Host-owned queue (B-2) ---
  // The reserved track is shown apart from the pending ones because it is no
  // longer ours: the engine has already been handed it for preparation and
  // there is no way to take it back (see src-tauri/src/queue.rs). Editing the
  // pending entries therefore takes effect from the track after that one.
  //
  // An empty queue is not an empty playlist -- the drain policy falls back to
  // walking the music folder -- so the table simply disappears when there is
  // nothing queued rather than claiming playback is about to stop.
  const queue = document.getElementById("queue");

  function renderQueue(q) {
    const name = (p) => p.split("/").pop();
    const last = q.pending.length - 1;
    const reserved = q.reserved
      ? `<tr><td class="reserved">▶ ${name(q.reserved)}</td>` +
        `<td class="act">reserved</td></tr>`
      : "";
    const pending = q.pending
      .map(
        (p, i) =>
          `<tr><td>${name(p)}</td><td class="act">` +
          `<button class="mini" data-up="${i}"${i === 0 ? " disabled" : ""}>↑</button> ` +
          `<button class="mini" data-down="${i}"${i === last ? " disabled" : ""}>↓</button> ` +
          `<button class="mini" data-del="${i}">✕</button></td></tr>`
      )
      .join("");
    queue.innerHTML =
      reserved || pending
        ? `<tr><th>queue</th><th></th></tr>${reserved}${pending}`
        : "";
  }

  async function refreshQueue() {
    try {
      renderQueue(await invoke("queue_state"));
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  }

  // Only the tapped button (↑ / ↓ / ✕) goes disabled, same reasoning as the
  // library table above.
  queue.onclick = (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    withBusy(b, async () => {
      try {
        if (d.up !== undefined) {
          await invoke("reorder", { from: Number(d.up), to: Number(d.up) - 1 });
        } else if (d.down !== undefined) {
          await invoke("reorder", { from: Number(d.down), to: Number(d.down) + 1 });
        } else if (d.del !== undefined) {
          await invoke("dequeue", { index: Number(d.del) });
        }
        await refreshQueue();
      } catch (e) {
        log.innerHTML = `<span class="err">${e}</span>`;
      }
    });
  };

  // --- Transport state (D) ---
  // What the audio thread is actually doing, as opposed to which buttons the
  // webview has tapped -- so a stalled engine, or a pause driven by the
  // notification, shows up here too. See PHASE / player_state in lib.rs.
  const PHASE_LABEL = {
    idle: "idle",
    starting: "starting — preparing the first track",
    playing: "playing",
    paused: "paused",
    stalled: "waiting for the next track to be prepared",
    failed: "failed — see the log below; restart the app to try again",
    disconnected: "output device lost — reconnecting…",
  };

  function applyPhase(phase) {
    status.textContent = PHASE_LABEL[phase] ?? phase;
    status.className = phase;

    // "idle" only, not "failed" as well: the audio thread can only fail after
    // start() has already flipped its `started` latch, so offering the button
    // again would just answer "already started" in red. A failed start needs
    // the app restarted, and saying so in the status line beats a button that
    // looks like it would retry.
    const goEnabled = phase === "idle";
    goBtn.disabled = !goEnabled;
    goBtn.classList.toggle("st-off", !goEnabled);

    toggleBtn.classList.remove("st-playing", "st-paused", "st-off");
    if (phase === "playing" || phase === "stalled") {
      toggleBtn.disabled = false;
      toggleBtn.textContent = "⏸ pause";
      toggleBtn.classList.add("st-playing");
    } else if (phase === "paused") {
      toggleBtn.disabled = false;
      toggleBtn.textContent = "▶ play";
      toggleBtn.classList.add("st-paused");
    } else {
      // idle, starting, failed, disconnected
      toggleBtn.disabled = true;
      toggleBtn.classList.add("st-off");
    }

    const nextEnabled = phase === "playing" || phase === "paused" || phase === "stalled";
    nextBtn.disabled = !nextEnabled;
    nextBtn.classList.toggle("st-off", !nextEnabled);
  }

  async function refreshPlayerState() {
    try {
      const state = await invoke("player_state");
      applyPhase(state.phase);
      // Transition details stay off the always-visible UI; only the ⚑ button
      // enables when there is something to flag, and a toast appears right
      // after a press.
      nowEl.textContent = state.now_playing ?? "";
      const flagEnabled = !!state.last_transition;
      flagBtn.disabled = !flagEnabled;
      flagBtn.classList.toggle("st-off", !flagEnabled);
    } catch (e) {
      log.innerHTML = `<span class="err">${e}</span>`;
    }
  }

  // One timer for both: the reserved slot and the phase both change on the
  // audio thread's own schedule, with nothing else reporting it back, so both
  // have to be polled -- and there is no reason to run two separate timers
  // for it. start() also reloads queue.json, so the persisted queue shows up
  // here without the UI having to know when that happened.
  async function pollState() {
    await Promise.all([refreshQueue(), refreshPlayerState()]);
  }
  pollState();
  setInterval(pollState, 500);
</script>
